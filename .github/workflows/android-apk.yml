name: Build Verbum Dei Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: verbum-dei-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out Verbum Dei
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify website and app permissions
        run: |
          grep -q 'https://byblestudylb.github.io/verbum-dei/' android/app/src/main/java/lb/verbumdei/app/MainActivity.java
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          if grep -E 'android.permission.(CAMERA|READ_CONTACTS|ACCESS_FINE_LOCATION|RECORD_AUDIO|READ_SMS)' android/app/src/main/AndroidManifest.xml; then
            echo "Unexpected sensitive permission"; exit 1
          fi

      - name: Build installable debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signature and rename
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Verbum-Dei-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Verbum-Dei-Android.apk
          sha256sum Verbum-Dei-Android.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Verbum-Dei-Android-APK
          path: Verbum-Dei-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-preview-${GITHUB_RUN_NUMBER}" Verbum-Dei-Android.apk \
            --target "${GITHUB_SHA}" \
            --title "Verbum Dei Android APK preview ${GITHUB_RUN_NUMBER}" \
            --notes "Free Android installer for Verbum Dei. This is a debug-signed testing APK from the official byblestudyLB/verbum-dei repository, not a Google Play release. It needs internet for daily readings. Each independently built preview may use a different testing signature; to install a newer version you might need to uninstall the old one. Download only from the official repository." \
            --latest
