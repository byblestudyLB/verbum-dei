name: Deploy Verbum Dei to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Recheck OLM throughout the day (UTC) so a late calendar update is picked up.
    - cron: "15 1,4,7,10,13,16,19,22 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the OLM scraper dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/olm-deps" cheerio@1.0.0
          ln -s "$RUNNER_TEMP/olm-deps/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Check whether today's Gospel explanation is already saved
        id: gospel-cache
        run: |
          TODAY="$(TZ=Asia/Beirut date +%F)"
          if [ -f data/gospel-explanation.json ] && grep -q "\"date\": \"$TODAY\"" data/gospel-explanation.json; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify today's OLM readings before starting the explanation model
        run: |
          node --input-type=module <<'NODE'
          import dailyReadings from "./netlify/functions/daily-readings.js";
          const expected = new Intl.DateTimeFormat("en-CA", {
            timeZone: "Asia/Beirut", year: "numeric", month: "2-digit", day: "2-digit"
          }).format(new Date());
          const response = await dailyReadings();
          const data = await response.json();
          const complete = response.ok && !data.error && data.date === expected &&
            data.epistle?.arabic && data.gospel?.arabic;
          if (!complete) {
            console.error("OLM Arabic readings are not ready for " + expected + "; refusing to publish stale readings.", {
              returnedDate: data.date || null,
              error: data.error || null,
              epistleArabic: Boolean(data.epistle?.arabic),
              gospelArabic: Boolean(data.gospel?.arabic)
            });
            process.exit(1);
          }
          console.log("Verified complete OLM readings for " + expected + ".");
          NODE

      - name: Start the free local Gospel explanation model
        if: steps.gospel-cache.outputs.needed == 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3:4b

      - name: Assemble static website
        run: |
          mkdir -p _site/data
          cp index.html app.js botData.js prayers.js saints.js style.css _site/
          for attempt in 1 2 3 4; do
            if node scripts/generate-data.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "OLM daily data is not ready yet (attempt $attempt/4). Retrying in 90 seconds..."
              sleep 90
            fi
          done
          echo "Could not verify complete OLM readings for today after 4 attempts."
          exit 1

      - name: Save today's explanation so later visitors reuse it
        run: |
          if [ -f data/gospel-explanation.json ]; then
            git add data/gospel-explanation.json
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Save daily Gospel explanation [skip ci]"
              git push
            fi
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
