name: Deploy Verbum Dei to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Recheck OLM throughout the day (UTC) so a late calendar update is picked up.
    - cron: "15 1,4,7,10,13,16,19,22 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate installable PWA assets
        run: |
          node --check sw.js
          node --check pwa.js
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data=JSON.parse(fs.readFileSync("manifest.webmanifest","utf8"));
          if(data.display!=="standalone"||data.scope!=="./"||data.start_url!=="./?source=installed-app")throw new Error("PWA start path or display incorrect");
          if(!data.icons.some(icon=>icon.sizes==="192x192")||!data.icons.some(icon=>icon.sizes==="512x512"))throw new Error("Missing install icons");
          for (const size of [180,192,512]){
            const bytes=fs.readFileSync("icons/icon-"+size+".png");
            if(bytes.subarray(0,8).toString("hex")!=="89504e470d0a1a0a"||bytes.readUInt32BE(16)!==size||bytes.readUInt32BE(20)!==size)throw new Error("Invalid icon "+size);
          }
          for(const page of ["index.html","hymns.html"]){
            const source=fs.readFileSync(page,"utf8");
            if(!source.includes('rel="manifest" href="./manifest.webmanifest"')||!source.includes('src="./pwa.js?v=20261120-1"'))throw new Error("Install support missing from "+page);
          }
          const home=fs.readFileSync("index.html","utf8");
          if(!home.includes('id="installAppHomeButton"')||!home.includes('id="installAppButton"')||!home.includes('id="installDialog"'))throw new Error("Missing install UI");
          if(!fs.readFileSync("sw.js","utf8").includes('event.request.mode!=="navigate"'))throw new Error("Service worker must not cache live readings");
          console.log("Validated installable PWA, 3 PNG icons, safe offline fallback and install instructions.");
          NODE

      - name: Validate original and new bilingual prayers
        run: |
          node --check prayers.js
          node --check app.js
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import vm from "node:vm";
          const sandbox = {window: {}};
          vm.runInNewContext(fs.readFileSync("prayers.js", "utf8"), sandbox);
          const data = sandbox.window.PRAYER_DATA;
          if (!Array.isArray(data?.items) || data.items.length !== 54) throw new Error("Expected 54 bilingual prayers (15 existing + 39 new)");
          const established = ["sign-cross","our-father","hail-mary","glory-be","morning","evening","study","sacred-heart","divine-mercy","mary","charbel","rafqa","anthony","family","lebanon"];
          const categories = new Set(data.categories.map(c=>c.id));
          if (!categories.has("situations") || data.items.filter(p=>p.category==="situations").length !== 24) throw new Error("Situational prayer category incomplete");
          const norm = s=>String(s||"").normalize("NFKD").replace(/[\\u064B-\\u065F\\u0670]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").toLowerCase().replace(/\\s+/g," ").trim();
          const ids = new Set(), englishTitles = new Set(), arabicTitles = new Set(), prayersEn = new Set(), prayersAr = new Set();
          for (const p of data.items) {
            if (!categories.has(p.category) || !p.id || !p.enTitle || !p.arTitle || !p.en || !p.ar || !p.noteEn || !p.noteAr) throw new Error("Incomplete bilingual prayer: "+p.id);
            for (const [set,key] of [[ids,p.id],[englishTitles,norm(p.enTitle)],[arabicTitles,norm(p.arTitle)],[prayersEn,norm(p.en)],[prayersAr,norm(p.ar)]]) {
              if (set.has(key)) throw new Error("Duplicate prayer id, title or text: "+p.id);
              set.add(key);
            }
          }
          if (established.some(id=>!ids.has(id))) throw new Error("An existing prayer was lost");
          const app = fs.readFileSync("app.js","utf8"), page = fs.readFileSync("index.html","utf8");
          if (!app.includes("function applyPrayerSearch") || !app.includes("prayerSearchTerm") || !app.includes("id=\"prayerSearch\"")) throw new Error("Prayer search is missing");
          if (!page.includes("prayers.js?v=20261120-situations1")) throw new Error("New prayers are not cache-busted");
          console.log("Verified 15 preserved, 39 new, 24 situational and no duplicate prayer titles, IDs or texts.");
          NODE

      - name: Validate Saint of the Day biographies
        run: |
          node --check app.js
          node --check saints.js
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import vm from "node:vm";
          const sandbox = {
            document: { querySelector: () => ({}) },
            window: { addEventListener: () => {} }
          };
          vm.runInNewContext(fs.readFileSync("saints.js", "utf8"), sandbox, {timeout: 10000});
          const lookup = sandbox.window.verbumSaintBiographyByName;
          if (typeof lookup !== "function") throw new Error("Saint biography lookup not registered");
          const names = [
            "Charbel Makhlouf", "Rafqa Pietra Choboq Ar-Rayès",
            "Nimatullah Al-Hardini", "Aquilina of Byblos",
            "Anthony the Great", "Josephine Bakhita", "Francis of Assisi"
          ];
          for (const name of names) {
            const bio = lookup(name);
            if (!bio?.storyEn || bio.storyEn.length < 80 || !bio.storyAr || bio.storyAr.length < 40) {
              throw new Error("Complete bilingual biography missing for " + name);
            }
            console.log("Biography available in both languages: " + name);
          }
          const app = fs.readFileSync("app.js", "utf8");
          if (!app.includes("window.verbumSaintBiographyByName(saint.key)") ||
              !app.includes('class="saint-day-fullbio" open') ||
              !app.includes('timeZone:"Asia/Beirut"')) {
            throw new Error("Daily biography feature is not correctly connected");
          }
          const home = fs.readFileSync("index.html", "utf8");
          if (!home.includes("20261120-saintbio1")) throw new Error("Saint biography assets are not cache-busted");
          console.log("Daily saint biographies validated in 7 featured profiles.");
          NODE

      - name: Validate bilingual hymn library
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import vm from "node:vm";
          const page = fs.readFileSync("hymns.html", "utf8");
          const script = page.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if (!script) throw new Error("Hymns inline script missing");
          new vm.Script(script, {filename:"hymns.html"});
          const raw = script.match(/const hymns=(\[[\s\S]*?\]);\s*const categories=/)?.[1];
          if (!raw) throw new Error("Hymns metadata missing");
          const hymns = JSON.parse(raw);
          if (hymns.length < 67) throw new Error("Expected at least 67 curated hymns");
          if (hymns.filter(h => h.cat === "jesus").length < 11) throw new Error("Jesus hymns collection must contain at least 11 tracks");
          const expectedCategories = ["charbel","rafqa","rita","mary","christmas","jesus","easter"];
          for (const category of expectedCategories) {
            if (!hymns.some(h => h.cat === category)) throw new Error("Category missing: " + category);
          }
          const ids = new Set(), chapters = new Set();
          for (const h of hymns) {
            if (!/^[A-Za-z0-9_-]{11}$/.test(h.video) || !h.ar || !h.en) throw new Error("Invalid hymn metadata");
            if (!Number.isInteger(h.start) || h.start < 0 || h.end != null && h.end <= h.start) throw new Error("Invalid YouTube chapter");
            if (ids.has(h.id) || chapters.has(h.video + ":" + h.start)) throw new Error("Duplicate hymn");
            ids.add(h.id);
            chapters.add(h.video + ":" + h.start);
          }
          const home = fs.readFileSync("index.html", "utf8");
          if ((home.match(/href="\.\/hymns\.html"/g) || []).length < 2) throw new Error("Hymn links missing from main and mobile navigation");
          console.log("Hymn validation passed: " + hymns.length + " titled chapters across all seven categories.");
          NODE

      - name: Install the OLM scraper dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/olm-deps" cheerio@1.0.0
          ln -s "$RUNNER_TEMP/olm-deps/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Verify today's OLM readings and explanation before starting the model
        id: verify-olm
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          import dailyReadings from "./netlify/functions/daily-readings.js";
          const expected = new Intl.DateTimeFormat("en-CA", {
            timeZone: "Asia/Beirut", year: "numeric", month: "2-digit", day: "2-digit"
          }).format(new Date());
          const response = await dailyReadings();
          const data = await response.json();
          const complete = response.ok && !data.error && data.date === expected &&
            data.epistle?.arabic && data.epistle?.english &&
            data.gospel?.arabic && data.gospel?.english;
          if (!complete) {
            console.error("Complete bilingual OLM readings are not ready for " + expected + "; refusing to publish incomplete or stale readings.", {
              returnedDate: data.date || null,
              error: data.error || null,
              epistleReference: data.epistle?.reference || null,
              epistleEnglishReference: data.epistle?.englishReference || null,
              epistleArabic: Boolean(data.epistle?.arabic),
              epistleEnglish: Boolean(data.epistle?.english),
              gospelReference: data.gospel?.reference || null,
              gospelArabic: Boolean(data.gospel?.arabic),
              gospelEnglish: Boolean(data.gospel?.english)
            });
            process.exit(1);
          }
          console.log("Verified complete bilingual OLM readings for " + expected +
            ". Epistle: " + data.epistle.reference + "; Gospel: " + data.gospel.reference + ".");

          let savedExplanation = null;
          try {
            savedExplanation = JSON.parse(await fs.readFile("data/gospel-explanation.json", "utf8"));
          } catch {}
          const explanationMatches =
            savedExplanation?.date === expected &&
            savedExplanation?.gospelReference === data.gospel.reference;
          await fs.appendFile(
            process.env.GITHUB_OUTPUT,
            "needed=" + (explanationMatches ? "false" : "true") + "\n"
          );
          console.log(explanationMatches
            ? "A saved explanation matches today's OLM date and Gospel reference; skipping the model."
            : "No saved explanation matches today's OLM date and Gospel reference; generating a new one.");
          NODE

      - name: Start the free local Gospel explanation model
        if: steps.verify-olm.outputs.needed == 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3:4b

      - name: Assemble static website
        run: |
          mkdir -p _site/data
          cp index.html app.js botData.js prayers.js saints.js style.css hymns.html manifest.webmanifest sw.js pwa.js offline.html _site/
          mkdir -p _site/icons
          cp icons/app-icon.svg icons/icon-180.png icons/icon-192.png icons/icon-512.png _site/icons/
          for attempt in 1 2 3 4; do
            if node scripts/generate-data.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "OLM daily data is not ready yet (attempt $attempt/4). Retrying in 90 seconds..."
              sleep 90
            fi
          done
          echo "Could not verify complete OLM readings for today after 4 attempts."
          exit 1

      - name: Save today's explanation so later visitors reuse it
        run: |
          if [ -f data/gospel-explanation.json ]; then
            git add data/gospel-explanation.json
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Save daily Gospel explanation [skip ci]"
              git push
            fi
          fi

      # Give every run its own artifact name. GitHub retains old artifacts for
      # a day; the default shared name caused deploy-pages to find two artifacts
      # and fail even though the current site had built successfully.
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      
      - name: Verify live hymn page and homepage navigation
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --max-time 20 "https://byblestudyLB.github.io/verbum-dei/hymns.html?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o /tmp/hymns-live.html &&
               grep -q 'const categories=' /tmp/hymns-live.html &&
               grep -q 'id="dailyAgain"' /tmp/hymns-live.html &&
               grep -q 'verbum-hymn-of-day-v2' /tmp/hymns-live.html &&
               grep -q '"video":"oUHcLtucLaU"' /tmp/hymns-live.html &&
               grep -q '"video":"5lBJmnM0fXg"' /tmp/hymns-live.html &&
               curl -fsSL --max-time 20 "https://byblestudyLB.github.io/verbum-dei/?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o /tmp/hymns-home.html &&
               grep -q 'Your Hymn Today' /tmp/hymns-home.html &&
               grep -q 'class="hymn-invitation"' /tmp/hymns-home.html &&
               grep -q 'href="./hymns.html#today"' /tmp/hymns-home.html &&
               grep -q '20261120-situations1' /tmp/hymns-home.html &&
               curl -fsSL --max-time 20 "https://byblestudyLB.github.io/verbum-dei/prayers.js?verify=${GITHUB_RUN_ID}" -o /tmp/prayers-live.js &&
               grep -q 'id: "before-exam"' /tmp/prayers-live.js &&
               grep -q 'id: "situations"' /tmp/prayers-live.js &&
               grep -q '20261120-saintbio1' /tmp/hymns-home.html &&
               curl -fsSL --max-time 20 "https://byblestudyLB.github.io/verbum-dei/app.js?verify=${GITHUB_RUN_ID}" -o /tmp/app-live.js &&
               grep -q 'window.verbumSaintBiographyByName(saint.key)' /tmp/app-live.js &&
               grep -q 'saint-day-fullbio' /tmp/app-live.js &&
               grep -q 'function applyPrayerSearch' /tmp/app-live.js &&
               grep -q 'rel="manifest" href="./manifest.webmanifest"' /tmp/hymns-home.html &&
               grep -q 'id="installAppHomeButton"' /tmp/hymns-home.html &&
               curl -fsSL --max-time 20 "https://byblestudyLB.github.io/verbum-dei/manifest.webmanifest?verify=${GITHUB_RUN_ID}" -o /tmp/pwa-manifest.json &&
               grep -q '"display": "standalone"' /tmp/pwa-manifest.json &&
               curl -fsSL --max-time 20 "https://byblestudyLB.github.io/verbum-dei/sw.js?verify=${GITHUB_RUN_ID}" -o /tmp/pwa-sw.js &&
               grep -q 'Never cache live Maronite/OLM readings' /tmp/pwa-sw.js &&
               curl -fsSL --max-time 20 "https://byblestudyLB.github.io/verbum-dei/icons/icon-192.png?verify=${GITHUB_RUN_ID}" -o /tmp/pwa-icon.png &&
               node -e 'const b=require("fs").readFileSync("/tmp/pwa-icon.png");if(b.readUInt32BE(16)!==192)process.exit(1)' &&
               curl -fsSL --max-time 20 "https://byblestudyLB.github.io/verbum-dei/saints.js?verify=${GITHUB_RUN_ID}" -o /tmp/saints-live.js &&
               grep -q 'window.verbumSaintBiographyByName' /tmp/saints-live.js; then
              echo "Verified live hymn page, homepage navigation, and Saint of the Day full biography feature."
              exit 0
            fi
            echo "Live hymn page and menu not yet verified (attempt $attempt/8)."
            sleep 15
          done
          echo "Live hymn page and menu could not be verified." >&2
          exit 1

